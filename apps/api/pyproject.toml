[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gitaudit-api"
version = "0.1.0"
description = "Read-only repository health API for GitAudit"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.0,<2",
  "prometheus-client>=0.21,<1",
  "psycopg[binary]>=3.2,<4",
  "PyJWT[crypto]>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "actionlint-py>=1.7.12,<2",
  "aiosqlite>=0.20,<1",
  "build>=1.2,<2",
  "hatchling>=1.25,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5.0,<6",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/maintainer_api"]
strict-naming = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-p pytest_asyncio.plugin -p pytest_cov --cov=maintainer_api --cov-report=term-missing --cov-report=xml --cov-fail-under=80"

[tool.coverage.run]
source = ["maintainer_api"]
omit = [
  "src/maintainer_api/__init__.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
target-version = "py312"
